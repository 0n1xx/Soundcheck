<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artists · Soundcheck</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{template "icons"}}

<div class="window">
    {{template "sidebar" .}}

    <main class="pane">
        <header class="toolbar">
            <div class="toolbar__arrows" aria-hidden="true"><span>‹</span><span>›</span></div>
            <h1>Artists</h1>

            <!-- Add an artist, like "New folder" in a file browser -->
            <div class="toolbar__right">
                <form class="inline-form" method="post" action="/artists/add">
                    <input name="artist" placeholder="Add an artist" aria-label="Artist name" required>
                    <button class="button button--default" type="submit">Add</button>
                </form>
            </div>
        </header>

        <section class="content">
            {{if .Error}}<p class="form-error" role="alert">{{.Error}}</p>{{end}}

            {{if .Artists}}
            <!-- Each artist is a folder -->
            <ul class="folders" aria-label="Tracked artists">
                {{range .Artists}}
                <li class="folder">
                    <svg aria-hidden="true"><use href="#i-folder-big"/></svg>
                    <span class="folder__name">{{.Name}}</span>
                    <form method="post" action="/artists/remove">
                        <input type="hidden" name="artist" value="{{.Name}}">
                        <button class="link-button" type="submit">Remove</button>
                    </form>
                </li>
                {{end}}
            </ul>
            {{else}}
            <p class="empty">You're not tracking anyone yet. Add your first artist above.</p>
            {{end}}
        </section>

        {{template "pathbar" .}}
    </main>
</div>
</body>
</html>
