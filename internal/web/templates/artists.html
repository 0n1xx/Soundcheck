<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artists · Soundcheck</title>
    <!-- Relative path for previewing the file today; Go will serve it from /static/ later -->
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<!-- Icon set: drawn once here, reused below with <use href="#..."> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.4-6-11a6 6 0 0 1 12 0c0 5.6-6 11-6 11z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="#9aa0a6"/><circle cx="17" cy="12" r="1.2" fill="#5ef08a"/></symbol>
    <symbol id="i-folder-big" viewBox="0 0 72 60"><path d="M4 8a4 4 0 0 1 4-4h18l6 6h32a4 4 0 0 1 4 4v38a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#4a8fe0"/><path d="M4 18a4 4 0 0 1 4-4h56a4 4 0 0 1 4 4v34a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#7ab5f2"/></symbol>
</svg>

<div class="window">
    <!-- Sidebar for logged-in users -->
    <aside class="sidebar">
        <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>

        <nav aria-label="Main">
            <p class="sidebar__title">Library</p>
            <a class="sidebar__item" href="/shows"><svg><use href="#i-folder"/></svg>Upcoming shows<span class="badge">3</span></a>
            <a class="sidebar__item is-active" href="/artists" aria-current="page"><svg><use href="#i-folder"/></svg>Artists<span class="badge">3</span></a>

            <p class="sidebar__title">Location</p>
            <a class="sidebar__item" href="/settings#city"><svg><use href="#i-pin"/></svg>Toronto</a>

            <p class="sidebar__title">Account</p>
            <a class="sidebar__item" href="/settings"><svg><use href="#i-gear"/></svg>Settings</a>
            <form method="post" action="/logout">
                <button class="sidebar__item" type="submit"><svg><use href="#i-doc"/></svg>Log out</button>
            </form>
        </nav>
    </aside>

    <main class="pane">
        <header class="toolbar">
            <div class="toolbar__arrows" aria-hidden="true"><span>‹</span><span>›</span></div>
            <h1>Artists</h1>

            <!-- Add an artist, like "New folder" in a file browser -->
            <div class="toolbar__right">
                <form class="inline-form" method="post" action="/artists/add">
                    <input name="artist" placeholder="Add an artist" aria-label="Artist name" required>
                    <button class="button button--default" type="submit">Add</button>
                </form>
            </div>
        </header>

        <section class="content">
            <!-- Each artist is a folder; sample data for the mockup -->
            <ul class="folders" aria-label="Tracked artists">
                <li class="folder">
                    <svg aria-hidden="true"><use href="#i-folder-big"/></svg>
                    <span class="folder__name">Danny Brown</span>
                    <form method="post" action="/artists/remove">
                        <input type="hidden" name="artist" value="Danny Brown">
                        <button class="link-button" type="submit">Remove</button>
                    </form>
                </li>
                <li class="folder">
                    <svg aria-hidden="true"><use href="#i-folder-big"/></svg>
                    <span class="folder__name">JPEGMAFIA</span>
                    <form method="post" action="/artists/remove">
                        <input type="hidden" name="artist" value="JPEGMAFIA">
                        <button class="link-button" type="submit">Remove</button>
                    </form>
                </li>
                <li class="folder">
                    <svg aria-hidden="true"><use href="#i-folder-big"/></svg>
                    <span class="folder__name">Little Simz</span>
                    <form method="post" action="/artists/remove">
                        <input type="hidden" name="artist" value="Little Simz">
                        <button class="link-button" type="submit">Remove</button>
                    </form>
                </li>
            </ul>

            <!-- Empty state, shown instead of the folders when the list is empty:
            <p class="empty">You're not tracking anyone yet. Add your first artist above.</p>
            -->
        </section>

        <footer class="pathbar">
            <span><svg><use href="#i-disk"/></svg> Soundcheck HD</span>
            <span>Users</span>
            <span>vlad</span>
            <span>Artists</span>
        </footer>
    </main>
</div>
</body>
</html>
