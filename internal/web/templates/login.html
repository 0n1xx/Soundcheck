<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Soundcheck</title>
    <!-- Relative path for previewing the file today; Go will serve it from /static/ later -->
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<!-- Icon set: drawn once here, reused below with <use href="#..."> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="#9aa0a6"/><circle cx="17" cy="12" r="1.2" fill="#5ef08a"/></symbol>
    <symbol id="i-google" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6.1C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 2.9-2.2 5.4-4.7 7.1l7.3 5.7c4.3-4 7.2-9.9 7.2-17.3z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></symbol>
</svg>

<div class="window">
    <!-- Sidebar for visitors who are not logged in -->
    <aside class="sidebar">
        <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>

        <nav aria-label="Main">
            <p class="sidebar__title">Soundcheck</p>
            <a class="sidebar__item" href="/"><svg><use href="#i-folder"/></svg>Welcome</a>
            <a class="sidebar__item is-active" href="/login" aria-current="page"><svg><use href="#i-folder"/></svg>Log in</a>

            <p class="sidebar__title">Other</p>
            <a class="sidebar__item" href="/privacy"><svg><use href="#i-doc"/></svg>Privacy</a>
        </nav>
    </aside>

    <main class="pane">
        <header class="toolbar">
            <div class="toolbar__arrows" aria-hidden="true"><span>‹</span><span>›</span></div>
            <h1>Log in</h1>
        </header>

        <section class="content centered">
            <!-- Login dialog -->
            <section class="dialog" aria-labelledby="login-title">
                <header class="dialog__title">
                    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
                    <h2 id="login-title" class="dialog__heading">Welcome back</h2>
                </header>

                <section class="dialog__body">
                    <a class="button button--wide" href="/auth/google"><svg><use href="#i-google"/></svg>Continue with Google</a>

                    <div class="divider">or</div>

                    <form method="post" action="/login">
                        <div class="field">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" autocomplete="email" required>
                        </div>

                        <div class="field">
                            <label for="password">Password</label>
                            <input id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>

                        <button class="button button--default button--wide" type="submit">Log in</button>
                    </form>

                    <p class="switch">New here? <a href="/">Create an account</a></p>
                </section>
            </section>
        </section>

        <footer class="pathbar">
            <span><svg><use href="#i-disk"/></svg> Soundcheck HD</span>
            <span>Log in</span>
        </footer>
    </main>
</div>
</body>
</html>
