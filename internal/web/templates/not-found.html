<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Soundcheck</title>
    <!-- Relative path for previewing the file today; Go will serve it from /static/ later -->
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<!-- Icon set: drawn once here, reused below with <use href="#..."> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="#9aa0a6"/><circle cx="17" cy="12" r="1.2" fill="#5ef08a"/></symbol>
    <!-- Big folder with a question mark, for the "not found" alert -->
    <symbol id="i-folder-missing" viewBox="0 0 72 60"><path d="M4 8a4 4 0 0 1 4-4h18l6 6h32a4 4 0 0 1 4 4v38a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#4a8fe0"/><path d="M4 18a4 4 0 0 1 4-4h56a4 4 0 0 1 4 4v34a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#7ab5f2"/><text x="36" y="47" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">?</text></symbol>
</svg>

<div class="window">
    <!-- Neutral sidebar: works whether the visitor is logged in or not -->
    <aside class="sidebar">
        <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>

        <nav aria-label="Main">
            <p class="sidebar__title">Soundcheck</p>
            <a class="sidebar__item" href="/"><svg><use href="#i-folder"/></svg>Welcome</a>
            <a class="sidebar__item" href="/login"><svg><use href="#i-folder"/></svg>Log in</a>

            <p class="sidebar__title">Other</p>
            <a class="sidebar__item" href="/privacy"><svg><use href="#i-doc"/></svg>Privacy</a>
        </nav>
    </aside>

    <main class="pane">
        <header class="toolbar">
            <div class="toolbar__arrows" aria-hidden="true"><span>‹</span><span>›</span></div>
            <h1>Page not found</h1>
        </header>

        <section class="content centered">
            <!-- Classic alert: big icon on the left, message and button on the right -->
            <section class="dialog" role="alert" aria-labelledby="notfound-title">
                <header class="dialog__title">
                    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
                    <span>Soundcheck</span>
                </header>

                <section class="dialog__body alert">
                    <svg class="alert__icon" aria-hidden="true"><use href="#i-folder-missing"/></svg>

                    <div>
                        <h2 id="notfound-title" class="alert__title">This page doesn't exist</h2>
                        <p class="alert__text">The link may be mistyped or the page was moved.</p>
                        <p class="alert__actions">
                            <a class="button button--default" href="/">Go to Soundcheck</a>
                        </p>
                    </div>
                </section>
            </section>
        </section>

        <footer class="pathbar">
            <span><svg><use href="#i-disk"/></svg> Soundcheck HD</span>
            <span>Page not found</span>
        </footer>
    </main>
</div>
</body>
</html>
